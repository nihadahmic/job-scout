name: collect

# Code lives in this (public) repo. Collected data lives in a separate private repo,
# so job descriptions and application history are never published. See docs/decisions.md #008.
#
# Setup:
#   - private repo, default <owner>/job-scout-data (override with the DATA_REPO repo variable)
#   - DATA_REPO_TOKEN secret: fine-grained token, that repo only, Contents: read and write

on:
  schedule:
    - cron: "30 7 * * *"   # daily 07:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_REPO: ${{ vars.DATA_REPO || format('{0}/job-scout-data', github.repository_owner) }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check data repo token
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::DATA_REPO_TOKEN secret is not set. See the setup notes at the top of this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Collect
        # Counts only, no listing content, so the summary is safe to show in public run logs.
        run: uv run python -m collector --db private-data/jobs.sqlite | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit data to private repo
        working-directory: private-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.sqlite
          if git diff --cached --quiet; then
            echo "No new listings."
          else
            git commit -m "data: collector run $(date -u +%Y-%m-%d)"
            git push
          fi
