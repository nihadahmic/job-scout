name: collect

# Code lives in this (public) repo. Jobs go to Supabase; the private data repo holds the
# private config the collector reads (company watchlist). See docs/decisions.md #008, #012.
#
# Setup:
#   - SUPABASE_URL, SUPABASE_SERVICE_KEY secrets: the project URL and its secret key
#   - GEMINI_API_KEY secret: for screening (skipped with a notice when missing)
#   - DATA_REPO_TOKEN secret: fine-grained token for the data repo, Contents: read
#   - data repo, default <owner>/job-scout-data (override with the DATA_REPO repo variable),
#     holding companies.yaml (scripts/import_companies.py, scripts/detect_ats.py)

on:
  # Main trigger: Vercel Cron at 07:30 UTC (app/vercel.json -> /api/cron/collect). GitHub's
  # schedule is best-effort (often hours late or skipped), so it is only the fallback and
  # skips itself if a run already happened today.
  schedule:
    - cron: "17 9 * * *"   # fallback, 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_REPO: ${{ vars.DATA_REPO || format('{0}/job-scout-data', github.repository_owner) }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w collect.yml --created ">=$(date -u +%F)" \
              --json databaseId,conclusion \
              --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion != "failure" and .conclusion != "cancelled")] | length')
            if [ "$n" -gt 0 ]; then skip=true; echo "Already ran today; skipping the fallback run."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  collect:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=""
          for name in DATA_REPO_TOKEN SUPABASE_URL SUPABASE_SERVICE_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See the setup notes at the top of this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Collect
        # Counts only, no listing content or URLs, so the summary is safe in public run logs.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          uv run python -m collector \
            --companies private-data/companies.yaml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Screen
        # Gemini rates the new jobs (tier, fit) and shortlists the best. Counts only in the log.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m screening | tee -a "$GITHUB_STEP_SUMMARY"
