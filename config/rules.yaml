# Rule-based prefilter. Runs in the collector before anything is stored, so screening
# (Gemini) only ever sees roles that pass. Patterns are case-insensitive regular expressions.
# Stages run in order; the first stage a job fails is its drop reason.

# Job category, from the title. First match wins, so the more specific ones come first.
categories:
  product_owner: '\bproduct\s+owner\b|\bpo\b'
  product_manager: '\bproduct\s+(manager|management|lead)\b|\bpm\b'
  business_analyst: '\bbusiness\s+analyst\b'
  project_manager: '\bproject\s+manager\b'
  implementation: '\bimplementation\b'

title:
  # Keep a job only if its title matches one of these.
  include:
    - '\bproduct\s+(manager|owner|management|lead)\b'
    - '\b(pm|po)\b'
    - '\bbusiness\s+analyst\b'
    - '\bproject\s+manager\b'
    - '\bimplementation\b'
  # ...and none of these seniority levels. The profile's "Seniority to skip" picks which
  # levels apply; without a profile, all of them do.
  exclude_levels: [intern, junior, associate, staff, principal, director, head, vp]

# Seniority levels by name, used by title.exclude_levels and the profile.
seniority:
  intern: '\b(intern|internship|trainee|graduate|working\s+student|werkstudent)\b'
  junior: '\b(junior|jr)\b'
  associate: '\bassociate\b'
  staff: '\bstaff\b'
  principal: '\bprincipal\b'
  director: '\bdirector\b'
  head: '\bhead\s+of\b'
  vp: '\b(vp|vice\s+president|chief|cpo)\b'

remote:
  # A job must be marked remote by its source, and its title/location must not say otherwise.
  reject:
    - '\bhybrid\b'
    - '\bon[\s-]?site\b'
    - '\bin[\s-]office\b'
    - '\boffice[\s-]based\b'
  # Hybrid or on-site jobs here pass the remote stage when the profile allows local work.
  local: ['\bsarajevo\b']

location:
  # Specific places that make a job eligible. These win over anything else in the location.
  # Grouped by label; the first matching label is saved as the job's location_match.
  allow:
    balkans:
      - '\bbosnia\b'
      - '\bserbia\b'
      - '\bcroatia\b'
      - '\bsarajevo\b'
      - '\bbih\b'
    europe:
      - '\bemea\b'
      - '\beurope(an)?\b(?!\s+union)'
      - '\bcentral\s+europe(an)?\b'
    cet:
      - '\b(cet|cest)\b'
      - '\b(utc|gmt)\s*\+\s*0?[12](:00)?\b'
  # Extra places the profile can switch on (all off without a profile). When on, they work
  # like the allow groups above.
  optional:
    slovenia: ['\bslovenia\b']
    montenegro: ['\bmontenegro\b']
    north_macedonia: ['\b(north\s+)?macedonia\b']
    balkans_region: ['\b(western\s+)?balkans?\b', '\bsouth[\s-]?east(ern)?\s+europe\b']
    cee: ['\bcee\b', '\bcentral\s+(and|&)\s+eastern\s+europe\b', '\beastern\s+europe\b']
  # When true, a plain "Remote" with no region anywhere is kept (location_match "unclear")
  # for screening to judge, instead of being dropped. The profile can switch this on.
  keep_unclear: false

  # Generic "anywhere" wording. Eligible only if the location names no other specific place
  # ("Anywhere in the World, United States" is US-only).
  anywhere:
    - '\bworld\s*wide\b'
    - '\banywhere\b'
    - '\bglobal(ly)?\b'
  # Words stripped before deciding whether a location is vague ("Remote", "Fully remote").
  vague:
    - '\b(fully|100%?|remote|remotely|work\s+from\s+home|wfh|flexible|distributed|in\s+the\s+world|unspecified)\b'
  # Labels for the drop reason when a location is not eligible. Only used for reporting.
  labels:
    latam_only: '\b(latam|latin\s+america|south\s+america)\b'
    us_only: '\b(usa?|united\s+states|america|north\s+america|canada)\b'
    uk_only: '\b(uk|united\s+kingdom|great\s+britain|england|london)\b'
    eu_only: '\b(eu|european\s+union|eea)\b'
  # When the location is vague, look for allowed wording in the description instead:
  # any `allow` pattern, or one of these. Plain "global" is too common in company blurbs.
  check_description_when_vague: true
  description_anywhere:
    - '\b(hire|hiring|work|live|based)\s+(from\s+)?(anywhere|worldwide)\b'
    - '\banywhere\s+in\s+the\s+world\b'
    - '\blocation[\s-]independent\b'
    - '\bremote[\s-]first,?\s+(worldwide|globally)\b'


authorization:
  # Drop when the description requires work authorization or residence in a place that is
  # not allowed above. The captured place is checked against location.allow.
  requires_place:
    - '(right|eligible|eligibility|authori[sz]ed|authori[sz]ation|permitted|legally\s+able)\s+to\s+work\s+in\s+(the\s+)?(?P<place>[a-z]+(\s+[a-z]+){0,2})'
    - 'must\s+(be\s+)?(based|located|resid(e|ent)|living|live)\s+in\s+(the\s+)?(?P<place>[a-z]+(\s+[a-z]+){0,2})'
  # A captured place matching any of these is not a real place ("in the country where you live").
  ignore_places:
    - '^(your|any|a|an|one|our|their|this|that|which|where|country|countries|location|region)\b'
    - '\b(time\s*zones?|timezones?|hours)\b'   # "based in EU timezone" is about hours, not residence
  # Phrases that always mean an EU/UK/US permit is required.
  always:
    - '\beu\s+(work\s+permit|citizen(ship)?|passport)\b'
    - '\b(us|u\.s\.)\s+citizen(ship)?\b'
    - '\bgreen\s+card\b'
    - '\bsecurity\s+clearance\b'

# Approximate salary in EUR per month, for filtering only (the original text is always kept).
salary:
  # Rough rates to EUR. Update now and then; they only need to be in the right range.
  fx_to_eur: {EUR: 1, USD: 0.9, GBP: 1.15, CHF: 1.05, CAD: 0.65, AUD: 0.6, PLN: 0.23,
              SEK: 0.087, NOK: 0.085, DKK: 0.134, CZK: 0.04, RON: 0.2, INR: 0.0105, BRL: 0.17, HUF: 0.0025}
  hours_per_month: 160
  days_per_month: 20

# Screening (Gemini) runs after collection on new jobs that passed the prefilter.
screening:
  batch_size: 5            # jobs per Gemini request
  max_per_run: 100         # cap so a big backlog is spread over a few days
  description_chars: 4000  # posting text sent per job
  shortlist_max_tier: 2    # tier 1 or 2 ...
  shortlist_min_fit: 60    # ... and fit at least this -> shortlisted
