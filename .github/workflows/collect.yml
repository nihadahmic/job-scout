name: collect

on:
  schedule:
    - cron: "30 7 * * *"   # daily 07:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Collect
        run: uv run python -m collector | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new listings."
          else
            git commit -m "data: collector run $(date -u +%Y-%m-%d)"
            git push
          fi
